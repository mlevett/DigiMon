[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DigiMon"
version = "1.0.0"
description = "Receive-only APRS digipeater monitor with desktop and service modes"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
digimon = "digimon.__main__:main"

[tool.setuptools.packages.find]
include = ["digimon*"]
